<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="0.55" stop-color="#10131a"/>
      <stop offset="1" stop-color="#0c0f15"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="0.5" stop-color="#f3a65a"/>
      <stop offset="1" stop-color="#66d9ef"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="8" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.035"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="460" fill="url(#bg)"/>
  <rect width="1600" height="460" fill="url(#grid)"/>

  <rect x="78" y="68" width="6" height="324" rx="3" fill="url(#accent)"/>
  <rect x="110" y="88" width="530" height="2" fill="#ffffff" opacity="0.16"/>
  <rect x="110" y="370" width="530" height="2" fill="#ffffff" opacity="0.10"/>

  <text x="112" y="178" fill="#f3efe7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="70" font-weight="700" letter-spacing="4">FRANS SADIE</text>
  <text x="116" y="224" fill="#ff8f70" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" letter-spacing="5">SOFTWARE ENGINEER</text>
  <text x="116" y="275" fill="#cfd5df" font-family="IBM Plex Mono,Consolas,monospace" font-size="19" letter-spacing="2">AI / DATA / SYSTEMS ARCHITECTURE / FULL-STACK</text>
  <text x="116" y="329" fill="#7f8a99" font-family="IBM Plex Mono,Consolas,monospace" font-size="15" letter-spacing="2">JOHANNESBURG, ZA   //   BUILDING RELIABLE SYSTEMS END TO END</text>

  <g transform="translate(900 95)">
    <text x="0" y="0" fill="#8792a3" font-family="IBM Plex Mono,Consolas,monospace" font-size="14" letter-spacing="2">SYSTEM VIEW</text>

    <g stroke="#8792a3" stroke-opacity="0.7" fill="#10141c">
      <rect x="0" y="64" width="130" height="54" rx="8"/>
      <rect x="205" y="20" width="140" height="54" rx="8"/>
      <rect x="205" y="112" width="140" height="54" rx="8"/>
      <rect x="205" y="204" width="140" height="54" rx="8"/>
      <rect x="425" y="64" width="135" height="54" rx="8"/>
      <rect x="425" y="158" width="135" height="54" rx="8"/>
    </g>

    <g fill="#e7ebf0" font-family="IBM Plex Mono,Consolas,monospace" font-size="15">
      <text x="28" y="97">CLIENTS</text>
      <text x="239" y="53">SERVICES</text>
      <text x="243" y="145">DATA</text>
      <text x="232" y="237">MODELS</text>
      <text x="458" y="97">APIs</text>
      <text x="452" y="191">OBSERVE</text>
    </g>

    <g stroke="url(#accent)" stroke-width="2.2" fill="none">
      <path d="M130 91H172V47H205"/>
      <path d="M130 91H205"/>
      <path d="M130 91H172V231H205"/>
      <path d="M345 47H390V91H425"/>
      <path d="M345 139H425"/>
      <path d="M345 231H390V185H425"/>
    </g>

    <g fill="#66d9ef">
      <circle cx="172" cy="91" r="4"/>
      <circle cx="390" cy="91" r="4"/>
      <circle cx="390" cy="185" r="4"/>
    </g>

    <text x="0" y="318" fill="#687484" font-family="IBM Plex Mono,Consolas,monospace" font-size="13" letter-spacing="1.5">ARCHITECTURE • DATA FLOWS • INTEGRATIONS • OBSERVABILITY</text>
  </g>

  <rect width="1600" height="460" filter="url(#grain)" opacity="0.9"/>
</svg>