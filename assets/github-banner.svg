<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1016"/>
      <stop offset="0.45" stop-color="#15151d"/>
      <stop offset="0.72" stop-color="#5a2035"/>
      <stop offset="1" stop-color="#d05a43"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd08a"/>
      <stop offset="1" stop-color="#f07b56"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d7d"/>
      <stop offset="1" stop-color="#ff7f6e"/>
    </linearGradient>
    <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="2" r="0.55" fill="#ffffff" opacity="0.05"/>
      <circle cx="6" cy="6" r="0.45" fill="#000000" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1600" height="460" fill="url(#sky)"/>
  <rect width="1600" height="460" fill="url(#grain)"/>

  <!-- sunset -->
  <circle cx="1185" cy="150" r="92" fill="url(#sun)" opacity="0.95"/>
  <g fill="#7b3140" opacity="0.65">
    <rect x="1098" y="142" width="174" height="10"/>
    <rect x="1107" y="162" width="156" height="9"/>
    <rect x="1120" y="182" width="130" height="8"/>
  </g>

  <!-- mountains -->
  <path d="M630 330 L790 215 L920 295 L1040 205 L1185 290 L1330 230 L1600 335 L1600 460 L630 460 Z" fill="#11151c" opacity="0.92"/>
  <path d="M480 355 L720 250 L845 310 L1010 250 L1200 322 L1440 274 L1600 345 L1600 460 L480 460 Z" fill="#0a0d12" opacity="0.95"/>

  <!-- city -->
  <g fill="#d87755" opacity="0.8">
    <rect x="820" y="325" width="10" height="45"/>
    <rect x="845" y="312" width="16" height="58"/>
    <rect x="875" y="332" width="12" height="38"/>
    <rect x="900" y="300" width="18" height="70"/>
    <rect x="935" y="322" width="13" height="48"/>
    <rect x="970" y="285" width="20" height="85"/>
    <rect x="1010" y="315" width="14" height="55"/>
    <rect x="1050" y="305" width="17" height="65"/>
    <rect x="1090" y="290" width="20" height="80"/>
    <rect x="1130" y="320" width="12" height="50"/>
  </g>

  <!-- road -->
  <path d="M0 390 C420 350 820 350 1600 372 L1600 460 L0 460 Z" fill="#0a0b0e"/>
  <path d="M0 402 C400 362 900 360 1600 382" fill="none" stroke="#ff5b63" stroke-width="2" opacity="0.35"/>

  <!-- simple retro hatch silhouette -->
  <g transform="translate(1235 302)">
    <path d="M0 74 L20 37 L105 28 L150 46 L177 72 L195 77 L195 107 L0 107 Z" fill="#111318" stroke="#d05059" stroke-width="2"/>
    <path d="M42 39 L101 34 L137 48 L154 70 L27 70 Z" fill="#1c222b" stroke="#555e6c" stroke-width="1.5"/>
    <circle cx="46" cy="106" r="20" fill="#050608" stroke="#3a3f46" stroke-width="4"/>
    <circle cx="150" cy="106" r="20" fill="#050608" stroke="#3a3f46" stroke-width="4"/>
    <rect x="168" y="76" width="16" height="8" fill="#ff665f"/>
  </g>

  <!-- title -->
  <text x="92" y="185" fill="#f1eadc" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="88" letter-spacing="2">FRANS SADIE</text>
  <text x="100" y="245" fill="url(#pink)" font-family="'Segoe Script','Brush Script MT',cursive" font-size="52" font-style="italic">Software Engineer</text>
  <text x="104" y="305" fill="#d9d1c7" font-family="Consolas,monospace" font-size="20" letter-spacing="4">AI / DATA / SYSTEMS ARCHITECTURE / FULL-STACK</text>

  <!-- vintage poster border -->
  <rect x="14" y="14" width="1572" height="432" fill="none" stroke="#e5d3b4" stroke-width="5" opacity="0.75"/>
  <rect x="24" y="24" width="1552" height="412" fill="none" stroke="#1b1714" stroke-width="2" opacity="0.9"/>

  <!-- distressed border chips -->
  <g fill="#0b0c0f" opacity="0.85">
    <rect x="10" y="10" width="135" height="18"/>
    <rect x="1510" y="10" width="82" height="16"/>
    <rect x="10" y="430" width="120" height="20"/>
    <rect x="1460" y="430" width="132" height="18"/>
    <rect x="10" y="70" width="16" height="92"/>
    <rect x="1574" y="260" width="16" height="95"/>
  </g>

  <g stroke="#e5d3b4" stroke-width="2" opacity="0.45">
    <path d="M35 28 L55 18 M78 28 L96 16 M150 442 L175 430 M360 442 L390 432 M1200 24 L1235 16 M1520 440 L1555 424"/>
    <path d="M22 180 L10 205 M22 305 L12 332 M1578 110 L1590 138 M1578 375 L1590 398"/>
  </g>

  <!-- tape -->
  <rect x="68" y="18" width="74" height="26" fill="#c5a77f" opacity="0.38" transform="rotate(-4 68 18)"/>
  <rect x="760" y="424" width="90" height="24" fill="#c5a77f" opacity="0.34" transform="rotate(2 760 424)"/>
</svg>